<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — LoginAuthentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora-bg" aria-hidden="true"></div>

  <div class="page-center">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 44px 40px;">
      <div class="auth-brand-logo" style="margin-bottom: 28px;">
        <span class="logo-mark" aria-hidden="true">A</span>
        <span>LoginAuthentication</span>
      </div>

      <div class="auth-heading">
        <h1>Set a new password</h1>
        <p>Resetting the password for <strong id="emailDisplay">your account</strong>.</p>
      </div>

      <form id="resetForm" novalidate>
        <div class="field-group">
          <label class="field-label" for="password">New password</label>
          <div class="field-control">
            <input class="field-input" type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" required />
            <button type="button" class="field-toggle" data-toggle-password data-target="password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
          <div class="strength-meter" id="strengthMeter">
            <div class="strength-track">
              <span class="strength-segment"></span>
              <span class="strength-segment"></span>
              <span class="strength-segment"></span>
              <span class="strength-segment"></span>
            </div>
            <span class="strength-label"></span>
          </div>
          <p class="field-error" id="passwordError"></p>
        </div>

        <div class="field-group">
          <label class="field-label" for="confirmPassword">Confirm new password</label>
          <div class="field-control">
            <input class="field-input" type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required />
            <button type="button" class="field-toggle" data-toggle-password data-target="confirmPassword" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
          </div>
          <p class="field-error" id="confirmPasswordError"></p>
        </div>

        <button type="submit" class="btn btn-primary" id="resetSubmit">
          <span class="btn-label">Reset password</span>
        </button>
      </form>

      <div id="resetInvalid" hidden>
        <div class="status-pill status-pill--weak" style="margin-bottom: 14px;">Invalid link</div>
        <p class="text-muted" style="line-height: 1.6; margin-bottom: 18px;">
          This password reset link is missing or malformed. Request a new one to continue.
        </p>
        <a href="forgot-password.html" class="btn btn-primary" style="text-decoration: none;">Request a new link</a>
      </div>

      <p class="auth-footer-link">Remembered it? <a class="link-accent" href="login.html">Back to log in</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
