<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — LoginAuthentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora-bg" aria-hidden="true"></div>

  <div class="page-center">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 44px 40px;">
      <div class="auth-brand-logo" style="margin-bottom: 28px;">
        <span class="logo-mark" aria-hidden="true">A</span>
        <span>LoginAuthentication</span>
      </div>

      <div class="auth-heading">
        <h1>Forgot your password?</h1>
        <p>Enter the email on your account and we'll send you a reset link.</p>
      </div>

      <form id="forgotForm" novalidate>
        <div class="field-group">
          <label class="field-label" for="email">Email address</label>
          <div class="field-control">
            <input class="field-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <p class="field-error" id="emailError"></p>
        </div>

        <button type="submit" class="btn btn-primary" id="forgotSubmit">
          <span class="btn-label">Send reset link</span>
        </button>
      </form>

      <div id="forgotSuccess" hidden>
        <div class="status-pill status-pill--strong" style="margin-bottom: 14px;">Check your inbox</div>
        <p class="text-muted" style="line-height: 1.6; margin-bottom: 18px;">
          If an account exists for that email, a reset link is on its way. It expires in 30 minutes.
        </p>
        <div id="devPreview" class="panel glass-card" style="padding: 16px; margin-bottom: 18px;" hidden>
          <p class="eyebrow" style="margin-bottom: 8px;">Local dev preview (no email server configured)</p>
          <a href="#" class="link-accent" style="word-break: break-all;"></a>
        </div>
      </div>

      <p class="auth-footer-link">Remembered it? <a class="link-accent" href="login.html">Back to log in</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
