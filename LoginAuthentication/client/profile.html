<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — LoginAuthentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora-bg" aria-hidden="true"></div>
  <div class="sidebar-backdrop"></div>

  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="auth-brand-logo">
        <span class="logo-mark" aria-hidden="true">A</span>
        <span>LoginAuth</span>
      </div>

      <nav class="app-nav" aria-label="Primary">
        <a class="app-nav-link" href="dashboard.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11l9-7 9 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Dashboard
        </a>
        <a class="app-nav-link" href="profile.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Profile
        </a>
      </nav>

      <div class="app-sidebar-footer">
        <div class="divider-line"></div>
        <div class="user-chip" style="margin-bottom: 16px;">
          <span class="avatar" data-user-initials></span>
          <div>
            <p class="user-chip-name" data-user-name></p>
            <p class="user-chip-email" data-user-email></p>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm btn-block" data-logout type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Log out
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="app-main">
      <header class="app-topbar">
        <button class="menu-toggle" data-sidebar-toggle aria-label="Toggle navigation menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="eyebrow">Profile</span>
        <span></span>
      </header>

      <main class="app-content">
        <h1 class="font-display" style="font-size: 1.7rem; margin-bottom: 6px;">Your profile</h1>
        <p class="text-muted" style="margin-bottom: 28px;">Manage your personal details and account security.</p>

        <!-- Profile summary -->
        <section class="glass-card panel" style="margin-bottom: 24px;">
          <div class="user-chip">
            <span class="avatar avatar--lg" id="avatarInitials"></span>
            <div>
              <p class="user-chip-name" style="font-size: 1.1rem;" data-user-name></p>
              <p class="text-faint" style="font-size: 0.85rem;" id="profileEmail"></p>
              <p class="text-faint" style="font-size: 0.78rem;" id="profileJoined"></p>
            </div>
          </div>
        </section>

        <div class="content-grid" style="grid-template-columns: 1fr 1fr; align-items: start;">
          <!-- Update profile -->
          <section class="glass-card panel">
            <div class="panel-header">
              <h3>Personal details</h3>
            </div>
            <form id="profileForm" novalidate>
              <div class="field-group">
                <label class="field-label" for="fullName">Full name</label>
                <div class="field-control">
                  <input class="field-input" type="text" id="fullName" name="fullName" autocomplete="name" required />
                </div>
                <p class="field-error" id="fullNameError"></p>
              </div>

              <div class="field-group">
                <label class="field-label" for="emailReadonly">Email address</label>
                <div class="field-control">
                  <input class="field-input" type="email" id="emailReadonly" value="" disabled style="opacity: 0.6; cursor: not-allowed;" />
                </div>
                <p class="field-hint">Email addresses can't be changed on this demo account.</p>
              </div>

              <button type="submit" class="btn btn-primary" id="profileSubmit">
                <span class="btn-label">Save changes</span>
              </button>
            </form>
          </section>

          <!-- Change password -->
          <section class="glass-card panel">
            <div class="panel-header">
              <h3>Change password</h3>
            </div>
            <form id="passwordForm" novalidate>
              <div class="field-group">
                <label class="field-label" for="currentPassword">Current password</label>
                <div class="field-control">
                  <input class="field-input" type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required />
                  <button type="button" class="field-toggle" data-toggle-password data-target="currentPassword" aria-label="Show password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
                  </button>
                </div>
              </div>

              <div class="field-group">
                <label class="field-label" for="newPassword">New password</label>
                <div class="field-control">
                  <input class="field-input" type="password" id="newPassword" name="newPassword" autocomplete="new-password" required />
                  <button type="button" class="field-toggle" data-toggle-password data-target="newPassword" aria-label="Show password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
                  </button>
                </div>
                <div class="strength-meter" id="strengthMeter">
                  <div class="strength-track">
                    <span class="strength-segment"></span>
                    <span class="strength-segment"></span>
                    <span class="strength-segment"></span>
                    <span class="strength-segment"></span>
                  </div>
                  <span class="strength-label"></span>
                </div>
                <p class="field-error" id="newPasswordError"></p>
              </div>

              <div class="field-group">
                <label class="field-label" for="confirmNewPassword">Confirm new password</label>
                <div class="field-control">
                  <input class="field-input" type="password" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password" required />
                  <button type="button" class="field-toggle" data-toggle-password data-target="confirmNewPassword" aria-label="Show password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
                  </button>
                </div>
                <p class="field-error" id="confirmNewPasswordError"></p>
              </div>

              <button type="submit" class="btn btn-danger btn-block" id="passwordSubmit">
                <span class="btn-label">Update password</span>
              </button>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
