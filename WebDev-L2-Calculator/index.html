<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calc — A Modern Calculator</title>
  <meta name="description" content="A glassmorphic calculator with a retro amber display, built with vanilla HTML, CSS, and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="stage">

    <main class="calculator" id="calculator" aria-label="Calculator">

      <!-- Header -->
      <header class="calc-header">
        <div class="calc-title">
          <span class="calc-title-mark">⌁</span>
          <h1>Calc</h1>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="historyToggle" type="button" aria-label="Toggle calculation history" aria-pressed="false" title="History">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg>
          </button>
          <button class="icon-btn" id="soundToggle" type="button" aria-label="Toggle button sounds" aria-pressed="false" title="Sound">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark theme" title="Theme">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
          </button>
        </div>
      </header>

      <!-- Display -->
      <section class="display" id="display">
        <div class="display-glass"></div>

        <div class="display-row">
          <span class="prev-expression" id="prevExpression" aria-live="off">&nbsp;</span>
        </div>

        <div class="display-row main-row">
          <span class="current-expression" id="currentExpression" aria-live="polite">0</span>
          <button class="copy-btn" id="copyBtn" type="button" aria-label="Copy result" title="Copy result">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          </button>
        </div>

        <p class="error-note" id="errorNote" role="alert"></p>
      </section>

      <!-- History Panel -->
      <section class="history-panel" id="historyPanel" aria-label="Calculation history" aria-hidden="true">
        <div class="history-panel-head">
          <span>History</span>
          <button class="text-btn" id="clearHistory" type="button">Clear</button>
        </div>
        <ul class="history-list" id="historyList">
          <li class="history-empty">No calculations yet</li>
        </ul>
      </section>

      <!-- Button Grid -->
      <section class="keys" aria-label="Calculator keys">

        <button class="key key-fn" data-action="clear" type="button">AC</button>
        <button class="key key-fn" data-action="delete" type="button" aria-label="Delete last character">DEL</button>
        <button class="key key-fn" data-action="percent" type="button">%</button>
        <button class="key key-op" data-op="÷" type="button" aria-label="Divide">÷</button>

        <button class="key key-num" data-num="7" type="button">7</button>
        <button class="key key-num" data-num="8" type="button">8</button>
        <button class="key key-num" data-num="9" type="button">9</button>
        <button class="key key-op" data-op="×" type="button" aria-label="Multiply">×</button>

        <button class="key key-num" data-num="4" type="button">4</button>
        <button class="key key-num" data-num="5" type="button">5</button>
        <button class="key key-num" data-num="6" type="button">6</button>
        <button class="key key-op" data-op="-" type="button" aria-label="Subtract">−</button>

        <button class="key key-num" data-num="1" type="button">1</button>
        <button class="key key-num" data-num="2" type="button">2</button>
        <button class="key key-num" data-num="3" type="button">3</button>
        <button class="key key-op" data-op="+" type="button" aria-label="Add">+</button>

        <button class="key key-fn" data-action="sign" type="button" aria-label="Toggle positive or negative">+/−</button>
        <button class="key key-num" data-num="0" type="button">0</button>
        <button class="key key-num" data-action="decimal" type="button" aria-label="Decimal point">.</button>
        <button class="key key-equals" data-action="equals" type="button" aria-label="Calculate result">=</button>

      </section>

      <footer class="calc-footer">
        <p>Built by a developer, for the Oasis Infobyte Level 2 internship.</p>
      </footer>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
